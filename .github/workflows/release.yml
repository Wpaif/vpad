# Empacota o binário para Linux (x86_64 e aarch64) e o anexa ao release do GitHub. Cada arquitetura
# compila nativamente no seu runner (nada de compilação cruzada).
# - Ao criar uma tag v*: gera os pacotes e publica (cria o release com as notas do changelog, se não existir).
# - Manualmente (Actions → Release → Run workflow): informe a tag de um release que já existe para
#   anexar os pacotes a ele; sem tag, só gera os pacotes como artefatos (para testar).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a empacotar e publicar (por exemplo v0.1.0). Em branco: só gera os artefatos de teste.'
        required: false
        default: ''
      fonte:
        description: 'Ref (branch, tag ou commit) a compilar. Em branco: a própria tag. Serve para anexar o pacote a uma tag anterior aos scripts de release (a versão do Cargo.toml precisa bater com a da tag).'
        required: false
        default: ''
      arquiteturas:
        description: 'Quais pacotes gerar: todas, x86_64 ou aarch64. Em branco: todas. Para acrescentar uma arquitetura a um release que já tem a outra, escolha só ela.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plano:
    name: plano
    runs-on: ubuntu-22.04
    outputs:
      matriz: ${{ steps.matriz.outputs.matriz }}
    env:
      ARQUITETURAS: ${{ inputs.arquiteturas }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fonte || inputs.tag || github.ref }}
      - id: matriz
        run: echo "matriz=$(./scripts/arquiteturas-do-release.sh "$ARQUITETURAS")" >> "$GITHUB_OUTPUT"

  empacotar:
    name: empacotar (${{ matrix.arch }})
    needs: plano
    # glibc mais antiga: o binário roda também em distribuições mais velhas que o runner
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plano.outputs.matriz) }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARQ: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fonte || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Construir a página (ela vai embutida no binário)
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Conferir que o binário abre sem /dev/uinput
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          ./target/release/vpad --dispositivos
      - name: Empacotar
        run: |
          versao="$(./scripts/versao-do-release.sh "$TAG")"
          ./scripts/empacotar-release.sh "$versao" target/release/vpad dist-release "$ARQ"
          ls -l dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.arch }}
          path: dist-release
          retention-days: 7

  publicar:
    name: publicar
    needs: empacotar
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fonte || inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: pacote-*
          merge-multiple: true
          path: dist-release
      - name: Criar o release, se ainda não existir, e anexar os pacotes
        run: |
          versao="$(./scripts/versao-do-release.sh "$TAG")"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            ./scripts/notas-do-release.sh "$versao" > notas.md
            gh release create "$TAG" --verify-tag --title "vpad $versao" --notes-file notas.md
          fi
          gh release upload "$TAG" dist-release/* --clobber
