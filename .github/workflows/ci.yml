# Integração contínua: roda em todo pull request e em todo push na master.
# Os três jobs (web, rust, hooks) são os que a proteção da master exige.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # svelte-check (tipos) + vite build; o build também é o que os testes do servidor leem
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  rust:
    name: rust
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # os testes do servidor leem web/dist (a página embutida): vem do job anterior
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sem /dev/uinput (runner do GitHub) os testes do dispositivo virtual se pulam sozinhos
      - run: cargo test --locked

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/testar-hooks.sh
