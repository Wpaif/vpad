<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7894ff"/>
      <stop offset="0.55" stop-color="#6a58f2"/>
      <stop offset="1" stop-color="#3a2cb4"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd8ff"/>
    </linearGradient>
    <linearGradient id="ombro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edff"/>
      <stop offset="1" stop-color="#b9c5fb"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#150b5e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#fundo)"/>
  <rect width="512" height="512" fill="url(#brilho)"/>

  <!-- tudo dentro do círculo de 80% (zona segura de ícones recortados) -->
  <g transform="translate(256 262) scale(0.94) translate(-256 -287)" filter="url(#sombra)">
    <!-- gatilhos -->
    <rect x="112" y="170" width="92" height="34" rx="17" fill="url(#ombro)"/>
    <rect x="308" y="170" width="92" height="34" rx="17" fill="url(#ombro)"/>
    <!-- corpo -->
    <path fill="url(#corpo)" d="M150 190h212c46 0 74 34 84 92l8 62c4 28-16 48-42 40-26-8-36-34-62-34H162c-26 0-36 26-62 34-26 8-46-12-42-40l8-62c10-58 38-92 84-92z"/>
  </g>

  <g transform="translate(256 262) scale(0.94) translate(-256 -287)">
    <!-- analógico esquerdo -->
    <circle cx="166" cy="252" r="31" fill="#2a2f78"/>
    <circle cx="166" cy="252" r="19" fill="#4a56b8"/>
    <!-- direcional -->
    <g fill="#2a2f78">
      <rect x="211" y="289" width="16" height="50" rx="5"/>
      <rect x="194" y="306" width="50" height="16" rx="5"/>
    </g>
    <!-- botões, nas cores do controle do app -->
    <circle cx="356" cy="221" r="14.5" fill="#fbbf24"/>
    <circle cx="329" cy="248" r="14.5" fill="#60a5fa"/>
    <circle cx="383" cy="248" r="14.5" fill="#f87171"/>
    <circle cx="356" cy="275" r="14.5" fill="#4ade80"/>
    <!-- analógico direito -->
    <circle cx="296" cy="309" r="27" fill="#2a2f78"/>
    <circle cx="296" cy="309" r="16" fill="#4a56b8"/>
    <!-- botões centrais -->
    <circle cx="241" cy="236" r="6" fill="#9aa6e6"/>
    <circle cx="271" cy="236" r="6" fill="#9aa6e6"/>
  </g>
</svg>
