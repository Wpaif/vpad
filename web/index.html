<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d12">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="vpad">
  <title>vpad</title>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <main id="pad" aria-label="Controle virtual">
    <section class="zone left">
      <div class="shoulders">
        <button class="shoulder" data-trigger="LT">LT</button>
        <button class="shoulder" data-btn="LB">LB</button>
      </div>
      <div class="dpad">
        <button data-btn="Up" class="up" aria-label="Cima"><svg viewBox="0 0 24 24"><path d="M12 6l7 9H5z"/></svg></button>
        <button data-btn="Left" class="left" aria-label="Esquerda"><svg viewBox="0 0 24 24"><path d="M6 12l9-7v14z"/></svg></button>
        <button data-btn="Right" class="right" aria-label="Direita"><svg viewBox="0 0 24 24"><path d="M18 12l-9 7V5z"/></svg></button>
        <button data-btn="Down" class="down" aria-label="Baixo"><svg viewBox="0 0 24 24"><path d="M12 18l-7-9h14z"/></svg></button>
      </div>
      <div class="stick" data-stick="left"><div class="knob"></div></div>
    </section>

    <section class="zone center">
      <button class="pill" data-btn="Select">Select</button>
      <button class="pill" data-btn="Start">Start</button>
    </section>

    <section class="zone right">
      <div class="shoulders">
        <button class="shoulder" data-btn="RB">RB</button>
        <button class="shoulder" data-trigger="RT">RT</button>
      </div>
      <div class="face">
        <button data-btn="Y" class="top">Y</button>
        <button data-btn="X" class="left">X</button>
        <button data-btn="B" class="right">B</button>
        <button data-btn="A" class="bottom">A</button>
      </div>
      <div class="stick" data-stick="right"><div class="knob"></div></div>
    </section>
  </main>

  <header class="topbar">
    <button id="status" class="status" aria-controls="stats" data-status="connecting">conectando…</button>
    <button id="toggle" class="toggle" aria-label="Mostrar ou ocultar controles">
      <svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.7 9 1.5 12c1.2 3 5 7 10.5 7s9.3-4 10.500-7C21.300 9 17.500 5 12 5zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>
    </button>
  </header>

  <aside id="install-hint" class="hint" hidden>
    <p>Para usar em tela cheia: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>, e abra pelo ícone.</p>
    <button id="install-hint-close" aria-label="Dispensar dica">×</button>
  </aside>

  <section id="stats" class="stats" hidden aria-label="Latência">
    <div class="picker-row">
      <span class="label">controle</span>
      <div id="profile-picker" class="picker" role="group" aria-label="Perfil do controle"></div>
      <button id="open-key-editor" class="link" type="button">Editar teclas…</button>
    </div>
    <dl>
      <div><dt>último</dt><dd data-stat="last">–</dd></div>
      <div><dt>média</dt><dd data-stat="avg">–</dd></div>
      <div><dt>mín</dt><dd data-stat="min">–</dd></div>
      <div><dt>máx</dt><dd data-stat="max">–</dd></div>
      <div><dt>jitter</dt><dd data-stat="jitter">–</dd></div>
      <div><dt>perda</dt><dd data-stat="loss">0%</dd></div>
    </dl>
    <svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true">
      <polyline data-stat="spark" points=""/>
    </svg>
  </section>

  <div id="key-editor" class="editor" role="dialog" aria-modal="true" aria-label="Editor de teclas" hidden></div>

  <div class="rotate" role="alert">Gire o celular para o modo paisagem</div>
</body>
</html>
