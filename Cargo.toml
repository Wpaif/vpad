[package]
name = "vpad"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
