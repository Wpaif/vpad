[package]
name = "vpad"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
evdev = "0.13.2"
futures-util = "0.3.34"
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
qrcode = "0.14.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
