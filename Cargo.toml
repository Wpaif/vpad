[package]
name = "vpad"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
evdev = "0.13.2"
futures-util = "0.3.34"
hmac = "0.13.0"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service", "http1", "http2"] }
inotify = "0.11.5"
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
qrcode = "0.14.1"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring", "crypto", "x509-parser"] }
rust-embed = "8.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
x509-parser = "0.18.1"

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
x509-parser = "0.18.1"
